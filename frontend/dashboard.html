<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
</head>
<body>
    <p id="global-message"></p>
    <p id="tasks" name="tasks">
        <ol id="list-container"></ol>
    </p>
    <p id="error-message" name="error-message"></p>
    <H3>create new task</h3>
    <form id="create-task">
        <label for="new-title"> Title:</label>
        <input type="text" id="new-title" name="new-title">
        <label for="new-details">Details:</label>
        <input type="text" name="new-details" id="new-details">
        <button type="submit" id="create-task-button">Create</button>

    </form>
    <div id="task-create-message"></div>

    <h3>Delete Task</h3>
    <form id="delete-task">
        <label for="task-id">Inter task Id:</label>
        <input type="text" name="task-id" id="task-id">

        <button type="submit" id="delete-task-button">Delete</button>
    </form>
  
    
    <p>logut</p>
    <a href="home.html">home</a>

</body>
<script src="dashboard.js"></script>
</html>
